<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
        }

        /* The black sheet that covers the screen during transitions */
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            opacity: 0;
            pointer-events: none; /* Allows clicking through it when invisible */
            z-index: 9999;
            transition: opacity 1.5s ease-in-out;
        }

        #fade-overlay.active {
            opacity: 1;
            pointer-events: auto; /* Blocks clicks while fading out */
        }

        #logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            max-width: 80vw;
            max-height: 80vh;
            transition: opacity 3s ease-in, left 1.5s ease-in-out, transform 1.5s ease-in-out;
        }

        #logo.fade-in { opacity: 1; }

        #logo.menu-mode {
            left: 25%;
            transform: translate(-50%, -50%) scale(0.8);
        }

        #menu {
            position: absolute;
            left: 55%;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: opacity 1.5s ease-in;
        }

        #menu.show {
            opacity: 1;
            pointer-events: auto;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #555;
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            cursor: pointer;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 8px;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .menu-btn:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div id="fade-overlay"></div>

    <img id="logo" src="textures/title.png" alt="DARK Logo">
    
    <div id="menu">
        <button class="menu-btn" id="play-btn">Play</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('logo');
            const menu = document.getElementById('menu');
            const playBtn = document.getElementById('play-btn');
            const fadeOverlay = document.getElementById('fade-overlay');
            
            let isMenuMode = false;
            let introTimeout;

            // Start intro fade
            setTimeout(() => {
                if (!isMenuMode) logo.classList.add('fade-in');
            }, 500);

            // Auto-transition to menu
            introTimeout = setTimeout(() => {
                if (!isMenuMode) transitionToMenu();
            }, 5000);

            // Click to bypass intro
            document.addEventListener('click', (e) => {
                if (e.target === playBtn) return; 
                if (!isMenuMode) {
                    clearTimeout(introTimeout);
                    transitionToMenu();
                }
            });

            function transitionToMenu() {
                isMenuMode = true;
                logo.classList.add('fade-in'); 
                logo.classList.add('menu-mode');
                setTimeout(() => {
                    menu.classList.add('show');
                }, 500);
            }

            // --- THE PLAY ACTION ---
            playBtn.addEventListener('click', () => {
                // 1. Activate the black overlay
                fadeOverlay.classList.add('active');

                // 2. Wait for the CSS transition to finish (1.5s as defined in style)
                // then change the window location
                setTimeout(() => {
                    window.location.href = 'forest.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>

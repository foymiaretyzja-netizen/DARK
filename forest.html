<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DARK - The Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Location: The Heart of the Woods</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

// --- SCENE SETUP ---
const scene = new THREE.Scene();

// SICKLY FOG: A murky, dark brownish-green to mix the red/green vibe
scene.fog = new THREE.FogExp2(0x151810, 0.025); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: false }); 
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050505); 
document.body.appendChild(renderer.domElement);

// --- LIGHTING ---
// AMBIENT: Brighter olive-green base so the player can navigate without a flashlight
const ambientLight = new THREE.AmbientLight(0x556644, 1.2); 
scene.add(ambientLight);

// RED MOONLIGHT: Casts a subtle red tint over the green world
const bloodMoonLight = new THREE.DirectionalLight(0xaa4444, 1.0);
bloodMoonLight.position.set(-100, 200, -100);
scene.add(bloodMoonLight);

// --- ELEVATION MATH ---
// This function calculates the height of the ground at any given X/Z coordinate
function getElevation(x, z) {
    const distFromCenter = Math.sqrt(x * x + z * z);
    
    // Flat center for the pentagram
    if (distFromCenter < 12) return 0;
    
    // Flattened hills (reduced the multipliers from 3.5 to 1.5)
    let height = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05) * 0.8;
    
    // Smoothly blend the flat center into the hills so there is no cliff
    if (distFromCenter < 18) {
        const blend = (distFromCenter - 12) / 6; // Goes from 0 to 1
        height *= blend;
    }
    
    return height;
}

// --- TERRAIN ---
const loader = new THREE.TextureLoader();
const grassTex = loader.load('textures/grass.jpg');
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(64, 64);
grassTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const terrainSize = 600;
const segments = 120;
const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);

const vertices = geometry.attributes.position.array;
for (let i = 0; i < vertices.length; i += 3) {
    // Plane geometry is X/Y, but rotated it becomes world X/Z
    const px = vertices[i];
    const pz = -vertices[i + 1]; 
    
    // Apply our elevation math
    vertices[i + 2] = getElevation(px, pz);
}
geometry.computeVertexNormals();

const material = new THREE.MeshStandardMaterial({ 
    map: grassTex, 
    roughness: 0.9,
    color: 0x99aa88 // Tinting the grass slightly to match the sickly lighting
});
const terrain = new THREE.Mesh(geometry, material);
terrain.rotation.x = -Math.PI / 2;
scene.add(terrain);

// --- BILLBOARD TREES ---
const treeTex1 = loader.load('textures/singulartree.png');
const treeTex2 = loader.load('textures/smalltreecluster.png');
const treeTex3 = loader.load('textures/treecluster.png');

// Slightly tinting trees so they fit the ambient light
const treeMaterials = [
    new THREE.SpriteMaterial({ map: treeTex1, color: 0xdddddd, fog: true }),
    new THREE.SpriteMaterial({ map: treeTex2, color: 0xdddddd, fog: true }),
    new THREE.SpriteMaterial({ map: treeTex3, color: 0xdddddd, fog: true })
];

const treeCount = 800; // Density of the forest
for (let i = 0; i < treeCount; i++) {
    const x = (Math.random() - 0.5) * terrainSize;
    const z = (Math.random() - 0.5) * terrainSize;
    
    // Don't spawn trees inside the ritual site
    if (Math.sqrt(x * x + z * z) < 18) continue;
    
    // Pick a random tree texture
    const mat = treeMaterials[Math.floor(Math.random() * treeMaterials.length)];
    const treeSprite = new THREE.Sprite(mat);
    
    // Randomize tree sizes slightly
    const width = 10 + Math.random() * 10; // 10 to 20 units wide
    const height = 15 + Math.random() * 15; // 15 to 30 units tall
    treeSprite.scale.set(width, height, 1);
    
    // Place tree exactly on top of the terrain height
    const groundY = getElevation(x, z);
    treeSprite.position.set(x, groundY + height / 2, z);
    
    scene.add(treeSprite);
}

// --- STARS & MOON ---
function createStars() {
    const starCount = 800;
    const starGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        const r = 800;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffaaaa, size: 1.5, sizeAttenuation: false });
    scene.add(new THREE.Points(starGeo, starMat));
}
createStars();

const moonTex = loader.load('textures/redmoon.png');
const moonMat = new THREE.SpriteMaterial({ map: moonTex, color: 0xff8888, fog: false });
const moon = new THREE.Sprite(moonMat);
moon.position.set(-300, 300, -400);
moon.scale.set(100, 100, 1);
scene.add(moon);

// --- PENTAGRAM ---
const pentaTex = loader.load('textures/pentagram.png');
const pentaMat = new THREE.MeshBasicMaterial({ 
    map: pentaTex, transparent: true, color: 0xff0000, 
    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
});
const pentagram = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), pentaMat);
pentagram.rotation.x = -Math.PI / 2;
pentagram.position.y = 0.05;
scene.add(pentagram);

const redLight = new THREE.PointLight(0xff0000, 25, 35);
redLight.position.set(0, 2, 0);
scene.add(redLight);

// --- PLAYER START ---
camera.position.set(0, 1.7, 5); 
camera.rotation.order = 'YXZ'; 

// --- MOVEMENT LOGIC ---
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

const onKeyDown = (e) => {
    switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyD': moveRight = true; break;
    }
};
const onKeyUp = (e) => {
    switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyD': moveRight = false; break;
    }
};
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', onKeyUp);

document.body.addEventListener('click', () => document.body.requestPointerLock());

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
        camera.rotation.y -= e.movementX * 0.002;
        camera.rotation.x -= e.movementY * 0.002;
        camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
    }
});

// --- GAME LOOP ---
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Horizontal Physics
    velocity.x -= velocity.x * 10.0 * delta;
    velocity.z -= velocity.z * 10.0 * delta;

    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveRight) - Number(moveLeft);
    direction.normalize();

    if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
    if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

    camera.translateX(-velocity.x * delta);
    camera.translateZ(-velocity.z * delta);
    
    // --- HEIGHT LOCK ---
    // Ensure the player walks ON the hills, not through them
    const currentGroundHeight = getElevation(camera.position.x, camera.position.z);
    camera.position.y = currentGroundHeight + 1.7; // 1.7 is player eye level

    const time = Date.now();
    pentagram.material.opacity = 0.4 + Math.sin(time * 0.002) * 0.4;
    redLight.intensity = 15 + Math.sin(time * 0.005) * 10;

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DARK - The Forest</title>

    <script>
        // The ultimate crash catcher. This runs before modules even exist.
        window.addEventListener('error', function(e) {
            const errorBox = document.createElement('div');
            errorBox.style.position = 'absolute';
            errorBox.style.top = '10%';
            errorBox.style.left = '50%';
            errorBox.style.transform = 'translateX(-50%)';
            errorBox.style.backgroundColor = '#aa0000';
            errorBox.style.color = 'white';
            errorBox.style.padding = '20px';
            errorBox.style.zIndex = '999999'; // Force to very front
            errorBox.style.fontFamily = 'monospace';
            errorBox.style.border = '2px solid white';
            
            // Format the error nicely
            errorBox.innerHTML = `
                <h2 style="margin-top:0;">CRASH DETECTED</h2>
                <p><strong>Error:</strong> ${e.message}</p>
                <p><strong>File:</strong> ${e.filename}</p>
                <p><strong>Line:</strong> ${e.lineno}</p>
            `;
            
            // Wait for the body to exist, then attach it
            if (document.body) {
                document.body.appendChild(errorBox);
            } else {
                window.addEventListener('DOMContentLoaded', () => document.body.appendChild(errorBox));
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-family: 'Courier New', monospace;
            text-shadow: 2px 2px black; pointer-events: none; z-index: 10;
        }
        /* ... the rest of your CSS ... */
        #static-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 4px);
            background-color: rgba(100, 100, 100, 0.2);
            opacity: 0; pointer-events: none; z-index: 5; mix-blend-mode: difference;
        }

        .screen-message {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            width: 500px; height: 150px; background-size: contain;
            background-repeat: no-repeat; background-position: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; z-index: 20;
        }

        #border-message { background-image: url('textures/bordermessage.png'); }
        #ghost-message { background-image: url('textures/ghostnearbymessage.png'); }

        /* TUTORIAL OVERLAY */
        #tutorial-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; transition: opacity 1s ease, transform 1s ease;
            cursor: pointer;
        }
        #tutorial-overlay img { max-width: 80%; max-height: 80%; object-fit: contain; }
        #tutorial-overlay p { color: #555; font-family: 'Courier New', monospace; margin-top: 20px; }

        /* INVENTORY OVERLAY */
        #inventory-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 10, 10, 0.85);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 40; font-family: 'Courier New', monospace; color: white;
        }
        
        #inspect-area {
            display: flex; width: 800px; height: 400px; margin-bottom: 30px;
            background-color: rgba(30, 30, 30, 0.5); border: 1px solid #444;
        }
        
        #inspect-image-container {
            width: 50%; height: 100%; display: flex; justify-content: center; align-items: center;
            border-right: 1px solid #444; padding: 10px; box-sizing: border-box;
        }
        
        #inspect-image { max-width: 100%; max-height: 100%; display: none; image-rendering: pixelated; }
        
        #inspect-text {
            width: 50%; padding: 20px; box-sizing: border-box;
            font-size: 16px; line-height: 1.5; white-space: pre-wrap;
        }

        #inventory-slots { display: flex; gap: 10px; }
        
        .inv-slot {
            width: 80px; height: 80px; background-color: rgba(50, 50, 50, 0.5);
            border: 2px solid #555; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: border-color 0.2s;
        }
        
        .inv-slot:hover { border-color: #fff; }
        .inv-slot img { max-width: 80%; max-height: 80%; pointer-events: none; }
        .inv-slot.active { border-color: #aa4444; }
    </style>
</head>
<body>

    <div id="static-overlay"></div>
    <div id="border-message" class="screen-message"></div>
    <div id="ghost-message" class="screen-message"></div>
    <div id="ui">Location: The Heart of the Woods</div>

    <div id="tutorial-overlay">
        <img src="pages/tut1.png" alt="How to play">
        <p>Click anywhere to wake up</p>
    </div>

    <div id="inventory-overlay">
        <div id="inspect-area">
            <div id="inspect-image-container">
                <img id="inspect-image" src="" alt="Inspect">
            </div>
            <div id="inspect-text">Select an item to inspect.</div>
        </div>
        <div id="inventory-slots">
            </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { isGamePaused, initTutorial } from './tut.js';
        import { initInventory, isInvOpen } from './inv.js';
        
        // I DELETED THE DUPLICATE FLASHLIGHT IMPORT HERE
        
        import { updateUIStatic, showGhostWarning } from './ui.js';
        import { updateGhost } from './ai.js';
        import { createFlashlight, updateFlashlight } from './flashlight.js';
        
        import { initLogs } from './logs.js'; // <--- ADD THIS LINE

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        // ... rest of your scene setup ...
scene.fog = new THREE.FogExp2(0x151810, 0.012); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
scene.add(camera); 

const renderer = new THREE.WebGLRenderer({ antialias: false }); 
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050505); 
document.body.appendChild(renderer.domElement);

// Initialize Flashlight (Attached to Camera)
createFlashlight(camera);

// --- LIGHTING ---
const ambientLight = new THREE.AmbientLight(0x556644, 1.2); 
scene.add(ambientLight);

// Finishing your cut-off line:
const bloodMoonLight = new THREE.DirectionalLight(0xaa4444, 1.0);
bloodMoonLight.position.set(-100, 200, -100);
scene.add(bloodMoonLight);
        // --- ELEVATION MATH ---
        function getElevation(x, z) {
            const distFromCenter = Math.sqrt(x * x + z * z);
            if (distFromCenter < 12) return 0;
            let height = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05) * 0.8;
            if (distFromCenter < 18) height *= (distFromCenter - 12) / 6; 
            return height;
        }

        // --- TERRAIN ---
        const loader = new THREE.TextureLoader();
        const grassTex = loader.load('textures/grass.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(100, 100);
        grassTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const terrainSize = 1000; 
        const segments = 150;
        const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);

        const vertices = geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const px = vertices[i];
            const pz = -vertices[i + 1]; 
            vertices[i + 2] = getElevation(px, pz);
        }
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9, color: 0xffffff });
        const terrain = new THREE.Mesh(geometry, material);
        terrain.rotation.x = -Math.PI / 2;
        scene.add(terrain);

        // --- CLOUDS ---
        const cloudTex = loader.load('textures/cloud.png');
        cloudTex.wrapS = cloudTex.wrapT = THREE.RepeatWrapping;
        cloudTex.repeat.set(8, 8); 
        
        const cloudMat = new THREE.MeshBasicMaterial({ 
            map: cloudTex, transparent: true, opacity: 0.08, depthWrite: false, color: 0x88aacc 
        });
        const skyClouds = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), cloudMat);
        skyClouds.rotation.x = -Math.PI / 2;
        skyClouds.position.y = 150; 
        scene.add(skyClouds);

        // --- BILLBOARD TREES ---
        const treeTex1 = loader.load('textures/singulartree.png');
        const treeTex2 = loader.load('textures/smalltreecluster.png');
        const treeTex3 = loader.load('textures/treecluster.png');

        const treeMatConfig = { transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, color: 0x111811 };
        const treeMaterials = [
            new THREE.MeshStandardMaterial({ map: treeTex1, ...treeMatConfig }),
            new THREE.MeshStandardMaterial({ map: treeTex2, ...treeMatConfig }),
            new THREE.MeshStandardMaterial({ map: treeTex3, ...treeMatConfig })
        ];

        const treeGeo = new THREE.PlaneGeometry(1, 1); 
        const treeData = []; 
        const treeCount = 3500; 

        for (let i = 0; i < treeCount; i++) {
            const x = (Math.random() - 0.5) * terrainSize;
            const z = (Math.random() - 0.5) * terrainSize;
            
            if (Math.sqrt(x * x + z * z) < 18) continue;
            
            const rand = Math.random();
            let mat, width, height, indent, colRadius;
            
            if (rand < 0.33) {
                mat = treeMaterials[0]; width = 10 + Math.random() * 5; height = 15 + Math.random() * 10;
                indent = 1.0; colRadius = 1.5; 
            } else if (rand < 0.66) {
                mat = treeMaterials[1]; width = 15 + Math.random() * 5; height = 18 + Math.random() * 10;
                indent = 2.5; colRadius = 3.0;
            } else {
                mat = treeMaterials[2]; width = 20 + Math.random() * 10; height = 20 + Math.random() * 10;
                indent = 4.0; colRadius = 5.0;
            }

            const treeMesh = new THREE.Mesh(treeGeo, mat);
            treeMesh.scale.set(width, height, 1);
            treeMesh.position.set(x, getElevation(x, z) + (height / 2) - indent, z);
            treeMesh.visible = false; 
            scene.add(treeMesh);
            treeData.push({ mesh: treeMesh, x: x, z: z, radius: colRadius });
        }
        // --- PROPS ---
        const moonTex = loader.load('textures/redmoon.png');
        const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, color: 0xff8888, fog: false }));
        moon.position.set(-400, 400, -500); moon.scale.set(150, 150, 1);
        scene.add(moon);

        const ghostTex = loader.load('textures/ghost.png');
        const ghostMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 4), new THREE.MeshStandardMaterial({ map: ghostTex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide, emissive: 0x112233 }));
        ghostMesh.position.set(-20, getElevation(-20, -20) + 2, -20);
        scene.add(ghostMesh);

        // --- PLAYER START ---
        camera.position.set(0, 1.7, 5); 
        camera.rotation.order = 'YXZ'; 

        // --- MOVEMENT LOGIC ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const onKeyDown = (e) => {
            if (isGamePaused || isInvOpen) return;
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        };
        const onKeyUp = (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // Click to lock pointer (unless inventory is open or game is paused)
        document.body.addEventListener('click', () => {
            if (!isGamePaused && !isInvOpen) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && !isGamePaused && !isInvOpen) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

       // --- INITIALIZE UI MODULES ---
        initLogs();

        initTutorial(() => {
            document.body.requestPointerLock();
        });

        initInventory((lockPointer) => {
            if (lockPointer) {
                document.body.requestPointerLock();
            } else {
                document.exitPointerLock();
                // Stop player momentum when inventory opens
                moveForward = false; moveBackward = false; moveLeft = false; moveRight = false;
            }
        }); // <--- THIS IS THE MISSING BRACKET THAT CRASHED THE GAME

        const borderMsgElem = document.getElementById('border-message');
        const RENDER_DIST_SQ = 230 * 230; 
        const clock = new THREE.Clock();
// --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // ONLY update physics, AI, and Flashlight if the game is active
            if (!isGamePaused && !isInvOpen) {
                // 1. Update Flashlight Battery
                updateFlashlight(delta);

                const oldX = camera.position.x;
                const oldZ = camera.position.z;

                // 2. Movement Physics
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(-velocity.z * delta);
                
                // 3. Boundaries
                const mapLimit = (terrainSize / 2) - 5; 
                const minEdgeDist = Math.min(mapLimit - Math.abs(camera.position.x), mapLimit - Math.abs(camera.position.z));

                if (minEdgeDist < 30) {
                    borderMsgElem.style.opacity = 1;
                    if (camera.position.x > mapLimit) camera.position.x = mapLimit;
                    if (camera.position.x < -mapLimit) camera.position.x = -mapLimit;
                    if (camera.position.z > mapLimit) camera.position.z = mapLimit;
                    if (camera.position.z < -mapLimit) camera.position.z = -mapLimit;
                } else {
                    borderMsgElem.style.opacity = 0;
                }

                // 4. Culling & Collision
                let isColliding = false;
                for (let i = 0; i < treeData.length; i++) {
                    const tree = treeData[i];
                    const distSq = (camera.position.x - tree.x) ** 2 + (camera.position.z - tree.z) ** 2;
                    
                    if (distSq < RENDER_DIST_SQ) {
                        tree.mesh.visible = true; 
                        tree.mesh.lookAt(camera.position.x, tree.mesh.position.y, camera.position.z);
                        if (distSq < (tree.radius * tree.radius)) isColliding = true;
                    } else {
                        tree.mesh.visible = false; 
                    }
                }

                if (isColliding) {
                    camera.position.x = oldX; camera.position.z = oldZ;
                    velocity.x = 0; velocity.z = 0;
                }

                // 5. Ghost AI & Static UI
                const distToGhost = camera.position.distanceTo(ghostMesh.position);
                updateUIStatic(distToGhost);
                if (distToGhost < 15) showGhostWarning();
                updateGhost(ghostMesh, camera, delta); 

                ghostMesh.lookAt(camera.position.x, ghostMesh.position.y, camera.position.z);
                camera.position.y = getElevation(camera.position.x, camera.position.z) + 1.7; 
                
                // 6. Environment Animation
                cloudTex.offset.x += 0.02 * delta;
                cloudTex.offset.y += 0.01 * delta;
            }

            // Always render the scene
            renderer.render(scene, camera);
        }

        // Start the loop
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

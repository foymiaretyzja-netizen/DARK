<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DARK - The Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Location: The Heart of the Woods</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        
        // THICK BLACK FOG: Pure black for maximum disorientation
        scene.fog = new THREE.FogExp2(0x000000, 0.08); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        // Dim Ambient: Barely visible base light
        const ambientLight = new THREE.AmbientLight(0x111111, 0.2); 
        scene.add(ambientLight);

        // MOONLIGHT: Pale blue directional light to define the hills
        const moonlight = new THREE.DirectionalLight(0x444477, 0.8);
        moonlight.position.set(50, 100, 50);
        scene.add(moonlight);

        // --- TERRAIN (HILLS WITH FLAT CENTER) ---
        const loader = new THREE.TextureLoader();
        const grassTex = loader.load('textures/grass.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(64, 64);

        const terrainSize = 500;
        const segments = 100;
        const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);
        
        const vertices = geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const y = vertices[i + 1];
            
            // Calculate distance from center to keep the ritual site flat
            const distFromCenter = Math.sqrt(x * x + y * y);
            
            if (distFromCenter < 12) {
                vertices[i + 2] = 0; // Flat ground for the pentagram
            } else {
                // Procedural hills
                vertices[i + 2] = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 2.5 + 
                                 Math.sin(x * 0.05) * 1.5;
            }
        }
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({ 
            map: grassTex, 
            roughness: 0.8 
        });
        const terrain = new THREE.Mesh(geometry, material);
        terrain.rotation.x = -Math.PI / 2;
        scene.add(terrain);

        // --- PENTAGRAM SITE (FIXED CLIPPING) ---
        const pentaTex = loader.load('textures/pentagram.png');
        const pentaGeo = new THREE.PlaneGeometry(10, 10);
        const pentaMat = new THREE.MeshBasicMaterial({ 
            map: pentaTex, 
            transparent: true, 
            color: 0xff0000, 
            side: THREE.DoubleSide,
            // Forces the pentagram to render above the grass even if they overlap
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });
        const pentagram = new THREE.Mesh(pentaGeo, pentaMat);
        pentagram.rotation.x = -Math.PI / 2;
        pentagram.position.y = 0.05; // Tiny height boost
        scene.add(pentagram);

        // Pulsing Red Glow Light
        const redLight = new THREE.PointLight(0xff0000, 15, 25);
        redLight.position.set(0, 1.5, 0);
        scene.add(redLight);

        // --- PLAYER START ---
        camera.position.set(0, 1.7, 5); 
        camera.rotation.order = 'YXZ'; 
        
        // --- BASIC MOVEMENT LOGIC ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const onKeyDown = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        };
        const onKeyUp = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
                // Added vertical looking for completeness
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Movement Physics
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(-velocity.z * delta);
            
            camera.position.y = 1.7; 

            // Make pentagram pulse
            const time = Date.now();
            pentagram.material.opacity = 0.4 + Math.sin(time * 0.002) * 0.4;
            redLight.intensity = 10 + Math.sin(time * 0.005) * 8;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>

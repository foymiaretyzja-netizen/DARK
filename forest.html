<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DARK - The Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px black;
            pointer-events: none;
            z-index: 10;
        }
        
        #static-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 4px);
            background-color: rgba(100, 100, 100, 0.2);
            opacity: 0; 
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: difference;
        }

        .screen-message {
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%);
            width: 500px; height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 20;
        }

        #border-message {
            background-image: url('textures/bordermessage.png');
        }

        #ghost-message {
            background-image: url('textures/ghostnearbymessage.png');
        }
    </style>
</head>
<body>

    <div id="static-overlay"></div>
    <div id="border-message" class="screen-message"></div>
    <div id="ghost-message" class="screen-message"></div>
    <div id="ui">Location: The Heart of the Woods</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x151810, 0.045); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        scene.add(camera); 

        const renderer = new THREE.WebGLRenderer({ antialias: false }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050505); 
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x556644, 1.2); 
        scene.add(ambientLight);

        const bloodMoonLight = new THREE.DirectionalLight(0xaa4444, 1.0);
        bloodMoonLight.position.set(-100, 200, -100);
        scene.add(bloodMoonLight);

        // --- FLASHLIGHT SETUP ---
        const flashlight = new THREE.SpotLight(0xffeedd, 150, 80, Math.PI / 7, 0.5, 1.5);
        flashlight.position.set(0, -0.2, 0); 
        camera.add(flashlight);
        camera.add(flashlight.target);
        flashlight.target.position.set(0, -0.2, -1); 

        // --- ELEVATION MATH ---
        function getElevation(x, z) {
            const distFromCenter = Math.sqrt(x * x + z * z);
            if (distFromCenter < 12) return 0;
            
            let height = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 1.5 + Math.sin(x * 0.05) * 0.8;
            if (distFromCenter < 18) {
                height *= (distFromCenter - 12) / 6; 
            }
            return height;
        }

        // --- TERRAIN ---
        const loader = new THREE.TextureLoader();
        const grassTex = loader.load('textures/grass.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(100, 100);
        grassTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const terrainSize = 1000; 
        const segments = 150;
        const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);

        const vertices = geometry.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const px = vertices[i];
            const pz = -vertices[i + 1]; 
            vertices[i + 2] = getElevation(px, pz);
        }
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({ 
            map: grassTex, roughness: 0.9, color: 0xffffff 
        });
        const terrain = new THREE.Mesh(geometry, material);
        terrain.rotation.x = -Math.PI / 2;
        scene.add(terrain);

        // --- BILLBOARD TREES ---
        const treeTex1 = loader.load('textures/singulartree.png');
        const treeTex2 = loader.load('textures/smalltreecluster.png');
        const treeTex3 = loader.load('textures/treecluster.png');

        const treeMatConfig = { transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, color: 0x111811 };
        const treeMaterials = [
            new THREE.MeshStandardMaterial({ map: treeTex1, ...treeMatConfig }),
            new THREE.MeshStandardMaterial({ map: treeTex2, ...treeMatConfig }),
            new THREE.MeshStandardMaterial({ map: treeTex3, ...treeMatConfig })
        ];

        const treeGeo = new THREE.PlaneGeometry(1, 1); 
        const treeData = []; 

        const treeCount = 1800; 
        for (let i = 0; i < treeCount; i++) {
            const x = (Math.random() - 0.5) * terrainSize;
            const z = (Math.random() - 0.5) * terrainSize;
            
            if (Math.sqrt(x * x + z * z) < 18) continue;
            
            const rand = Math.random();
            let mat, width, height, indent, colRadius;
            
            if (rand < 0.33) {
                mat = treeMaterials[0]; 
                width = 10 + Math.random() * 5; 
                height = 15 + Math.random() * 10;
                indent = 1.0; 
                colRadius = 1.5; 
            } else if (rand < 0.66) {
                mat = treeMaterials[1]; 
                width = 15 + Math.random() * 5; 
                height = 18 + Math.random() * 10;
                indent = 2.5; 
                colRadius = 3.0;
            } else {
                mat = treeMaterials[2]; 
                width = 20 + Math.random() * 10; 
                height = 20 + Math.random() * 10;
                indent = 4.0; 
                colRadius = 5.0;
            }

            const treeMesh = new THREE.Mesh(treeGeo, mat);
            treeMesh.scale.set(width, height, 1);
            
            const groundY = getElevation(x, z);
            treeMesh.position.set(x, groundY + (height / 2) - indent, z);
            
            // Start all trees as hidden. We let the render loop decide what to show.
            treeMesh.visible = false; 
            
            scene.add(treeMesh);
            treeData.push({ mesh: treeMesh, x: x, z: z, radius: colRadius });
        }

        // --- STARS & MOON ---
        function createStars() {
            const starCount = 800;
            const starGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const r = 800;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffaaaa, size: 1.5, sizeAttenuation: false });
            scene.add(new THREE.Points(starGeo, starMat));
        }
        createStars();

        const moonTex = loader.load('textures/redmoon.png');
        const moonMat = new THREE.SpriteMaterial({ map: moonTex, color: 0xff8888, fog: false });
        const moon = new THREE.Sprite(moonMat);
        moon.position.set(-400, 400, -500);
        moon.scale.set(150, 150, 1);
        scene.add(moon);

        // --- PENTAGRAM ---
        const pentaTex = loader.load('textures/pentagram.png');
        const pentaMat = new THREE.MeshBasicMaterial({ 
            map: pentaTex, transparent: true, color: 0xff0000, 
            side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
        });
        const pentagram = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), pentaMat);
        pentagram.rotation.x = -Math.PI / 2;
        pentagram.position.y = 0.05;
        scene.add(pentagram);

        const redLight = new THREE.PointLight(0xff0000, 25, 35);
        redLight.position.set(0, 2, 0);
        scene.add(redLight);

        // --- CANDLES ---
        const candleTex = loader.load('textures/candle.png');
        const candleMat = new THREE.MeshStandardMaterial({ 
            map: candleTex, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide 
        });
        const candleGeo = new THREE.PlaneGeometry(1, 1.5); 
        const candles = [];
        const radius = 5.5; 

        for(let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const cx = Math.cos(angle) * radius;
            const cz = Math.sin(angle) * radius;
            
            const candleMesh = new THREE.Mesh(candleGeo, candleMat);
            const groundY = getElevation(cx, cz);
            
            candleMesh.position.set(cx, groundY + 0.75, cz); 
            scene.add(candleMesh);
            candles.push(candleMesh);
        }

        // --- GHOST SETUP ---
        const ghostTex = loader.load('textures/ghost.png');
        const ghostMat = new THREE.MeshStandardMaterial({ 
            map: ghostTex, transparent: true, alphaTest: 0.1, 
            side: THREE.DoubleSide, emissive: 0x112233 
        });
        
        const ghostGeo = new THREE.PlaneGeometry(2, 4); 
        const ghostMesh = new THREE.Mesh(ghostGeo, ghostMat);
        ghostMesh.name = 'TheGhost'; 
        
        const ghostGlow = new THREE.PointLight(0x88bbff, 40, 15);
        ghostGlow.position.set(0, 0, 0);
        ghostMesh.add(ghostGlow);

        const gStartX = -20;
        const gStartZ = -20;
        
        ghostMesh.position.set(gStartX, getElevation(gStartX, gStartZ) + 2, gStartZ);
        scene.add(ghostMesh);

        // --- PLAYER START ---
        camera.position.set(0, 1.7, 5); 
        camera.rotation.order = 'YXZ'; 

        // --- MOVEMENT LOGIC ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const onKeyDown = (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        };
        const onKeyUp = (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        document.body.addEventListener('click', () => document.body.requestPointerLock());

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        // --- EVENT STATES & UI DOM ELEMENTS ---
        let hasShownGhostMessage = false;
        const staticOverlay = document.getElementById('static-overlay');
        const borderMsgElem = document.getElementById('border-message');
        const ghostMsgElem = document.getElementById('ghost-message');

        // Render distance optimization (Squared to save CPU cycles)
        const RENDER_DISTANCE = 80; 
        const RENDER_DIST_SQ = RENDER_DISTANCE * RENDER_DISTANCE;

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const oldX = camera.position.x;
            const oldZ = camera.position.z;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(-velocity.z * delta);
            
            // --- MAP BOUNDARY ---
            const mapLimit = (terrainSize / 2) - 5; 
            const distToEdgeX = mapLimit - Math.abs(camera.position.x);
            const distToEdgeZ = mapLimit - Math.abs(camera.position.z);
            const minEdgeDist = Math.min(distToEdgeX, distToEdgeZ);

            if (minEdgeDist < 30) {
                borderMsgElem.style.opacity = 1;
                if (camera.position.x > mapLimit) camera.position.x = mapLimit;
                if (camera.position.x < -mapLimit) camera.position.x = -mapLimit;
                if (camera.position.z > mapLimit) camera.position.z = mapLimit;
                if (camera.position.z < -mapLimit) camera.position.z = -mapLimit;
            } else {
                borderMsgElem.style.opacity = 0;
            }

            // --- OPTIMIZED TREE CULLING & COLLISION ---
            let isColliding = false;
            
            for (let i = 0; i < treeData.length; i++) {
                const tree = treeData[i];
                
                const dx = camera.position.x - tree.x;
                const dz = camera.position.z - tree.z;
                const distSq = dx * dx + dz * dz;
                
                // Only process trees within our designated render distance
                if (distSq < RENDER_DIST_SQ) {
                    tree.mesh.visible = true; // Turn rendering on
                    tree.mesh.lookAt(camera.position.x, tree.mesh.position.y, camera.position.z); // Billboard
                    
                    // Only check for physical collision if it's very close
                    if (distSq < (tree.radius * tree.radius)) {
                        isColliding = true;
                    }
                } else {
                    tree.mesh.visible = false; // Turn rendering off entirely (saves GPU/CPU)
                }
            }

            if (isColliding) {
                camera.position.x = oldX;
                camera.position.z = oldZ;
                velocity.x = 0;
                velocity.z = 0;
            }

            // --- GHOST PROXIMITY MECHANICS ---
            const distToGhost = camera.position.distanceTo(ghostMesh.position);

            if (distToGhost < 30) {
                const staticIntensity = 1 - (distToGhost / 30);
                staticOverlay.style.opacity = staticIntensity * Math.random(); 
            } else {
                staticOverlay.style.opacity = 0;
            }

            if (distToGhost < 15 && !hasShownGhostMessage) {
                hasShownGhostMessage = true;
                ghostMsgElem.style.opacity = 1;
                setTimeout(() => { ghostMsgElem.style.opacity = 0; }, 3000);
            }

            // --- PROPS BILLBOARDING ---
            candles.forEach(candle => {
                candle.lookAt(camera.position.x, candle.position.y, camera.position.z);
            });
            ghostMesh.lookAt(camera.position.x, ghostMesh.position.y, camera.position.z);

            // Terrain Height Following
            const currentGroundHeight = getElevation(camera.position.x, camera.position.z);
            camera.position.y = currentGroundHeight + 1.7; 

            // Animate pentagram
            const time = Date.now();
            pentagram.material.opacity = 0.4 + Math.sin(time * 0.002) * 0.4;
            redLight.intensity = 15 + Math.sin(time * 0.005) * 10;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // import { initGhostAI } from './ghost.js';
        // initGhostAI(scene, camera);
        // import { initFlashlight } from './flashlight.js';
        // initFlashlight(flashlight);
    </script>
</body>
</html>

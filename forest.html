<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DARK - The Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Location: The Heart of the Woods</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
// --- SCENE SETUP ---
const scene = new THREE.Scene();

// BLOOD FOG: A very deep, dark maroon-black fog
scene.fog = new THREE.FogExp2(0x1a0000, 0.03); 

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: false }); 
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050000); // Very dark red-black background
document.body.appendChild(renderer.domElement);

// --- LIGHTING (Blood Maroon) ---
// Dim Maroon Ambient: Gives everything a base reddish tint
const ambientLight = new THREE.AmbientLight(0x440000, 0.6); 
scene.add(ambientLight);

// RED MOONLIGHT: Casts maroon shadows and highlights the hills
const bloodMoonLight = new THREE.DirectionalLight(0x880000, 1.5);
bloodMoonLight.position.set(-100, 200, -100);
scene.add(bloodMoonLight);

// --- THE RED MOON ---
const loader = new THREE.TextureLoader();
const moonTex = loader.load('textures/redmoon.png');
const moonMat = new THREE.SpriteMaterial({ 
    map: moonTex, 
    color: 0xff6666, // Tint it slightly brighter red
    transparent: true,
    fog: false // The moon shouldn't be affected by fog
});
const moon = new THREE.Sprite(moonMat);
moon.position.set(-300, 400, -500); // Far away in the "sky"
moon.scale.set(120, 120, 1);
scene.add(moon);

// --- STARFIELD (Dots of varying sizes) ---
function createStars() {
    const starCount = 1000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starCount * 3);
    const sizes = new Float32Array(starCount);

    for (let i = 0; i < starCount; i++) {
        // Spread stars randomly in a large sphere around the map
        const r = 800;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);

        sizes[i] = Math.random() * 2.5; // Varying sizes
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const starMat = new THREE.PointsMaterial({
        color: 0xffaaaa, // Pale red/white stars
        size: 1.5,
        sizeAttenuation: false // Keeps them as dots regardless of distance
    });

    const starField = new THREE.Points(geometry, starMat);
    scene.add(starField);
}
createStars();

// --- TERRAIN (HILLS WITH FLAT CENTER) ---
const grassTex = loader.load('textures/grass.jpg');
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(64, 64);
grassTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const terrainSize = 600;
const segments = 120;
const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, segments, segments);

const vertices = geometry.attributes.position.array;
for (let i = 0; i < vertices.length; i += 3) {
    const x = vertices[i];
    const y = vertices[i + 1];
    const distFromCenter = Math.sqrt(x * x + y * y);
    
    if (distFromCenter < 12) {
        vertices[i + 2] = 0; 
    } else {
        vertices[i + 2] = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 3.5 + Math.sin(x * 0.05) * 2.0;
    }
}
geometry.computeVertexNormals();

const material = new THREE.MeshStandardMaterial({ 
    map: grassTex, 
    roughness: 0.8,
    color: 0x664444 // Tint the grass itself slightly maroon
});
const terrain = new THREE.Mesh(geometry, material);
terrain.rotation.x = -Math.PI / 2;
scene.add(terrain);

// --- PENTAGRAM ---
const pentaTex = loader.load('textures/pentagram.png');
const pentaMat = new THREE.MeshBasicMaterial({ 
    map: pentaTex, 
    transparent: true, 
    color: 0xff0000, 
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -1,
    polygonOffsetUnits: -1
});
const pentagram = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), pentaMat);
pentagram.rotation.x = -Math.PI / 2;
pentagram.position.y = 0.05;
scene.add(pentagram);

const redLight = new THREE.PointLight(0xff0000, 25, 35);
redLight.position.set(0, 2, 0);
scene.add(redLight);

// (Keep existing camera, movement, and animation loop...)
        // --- PLAYER START ---
        camera.position.set(0, 1.7, 5); 
        camera.rotation.order = 'YXZ'; 
        
        // --- BASIC MOVEMENT LOGIC ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const onKeyDown = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        };
        const onKeyUp = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.002;
                // Added vertical looking for completeness
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Movement Physics
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(-velocity.z * delta);
            
            camera.position.y = 1.7; 

            // Make pentagram pulse
            const time = Date.now();
            pentagram.material.opacity = 0.4 + Math.sin(time * 0.002) * 0.4;
            redLight.intensity = 10 + Math.sin(time * 0.005) * 8;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
